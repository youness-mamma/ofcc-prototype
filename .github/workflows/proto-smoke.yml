name: proto-smoke
# End-to-end check of the prototype with tiny settings (not a measurement).
on:
  workflow_dispatch:

env:
  FABRIC_VERSION: "2.5.16"
  FABRIC_CA_VERSION: "1.5.22"
  INSTALL_SCRIPT_SHA: "f1f5e006a6301b5c98611b24a7ec4aeeda6c283a"
  MINIO_RELEASE: "RELEASE.2025-10-15T17-29-55Z"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: client/go.sum
      - uses: actions/cache@v4
        with:
          path: minio-bin
          key: minio-${{ env.MINIO_RELEASE }}
      - name: Setup (Fabric, MinIO, bench)
        run: ./.github/actions-setup.sh
      - name: Network up (4 orgs, 3 Raft orderers) and deploy chaincode
        run: ./network/up.sh 4 1s 100
      - name: Bootstrap roles
        run: ./bin/bench bootstrap
      - name: E1 tiny, all systems
        run: |
          for s in ofcc noChain noSig noSeq noEnc ha cl; do
            ./bin/bench e1 -system $s -seed 101 -adversary adaptive -rounds 5 -pre 1 -post 1 -gws 3 -minio-data minio-data
          done
          ./bin/bench e1 -system ofcc -seed 101 -adversary naive -rounds 5 -pre 1 -post 1 -gws 3 -minio-data minio-data
      - name: E2 tiny
        run: for s in ofcc ha cl; do ./bin/bench e2 -system $s -seed 101 -outages 1 -gws 3; done
      - name: E3 tiny
        run: for s in ofcc ha cl; do ./bin/bench e3 -system $s -seed 101 -loads 50 -warmup 10s -measure 20s; done
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'peer0.org1|orderer0|dev-peer0.org1'); do echo "== $c"; docker logs --tail 60 $c 2>&1; done
          tail -50 minio.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto-smoke
          path: results/raw/
