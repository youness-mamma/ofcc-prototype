name: smoke
# Feasibility check: runner specs, official Fabric test network (v2.5.16), Go chaincode deploy + invoke, MinIO.
on:
  workflow_dispatch:

env:
  FABRIC_VERSION: "2.5.16"
  FABRIC_CA_VERSION: "1.5.22"
  INSTALL_SCRIPT_SHA: "f1f5e006a6301b5c98611b24a7ec4aeeda6c283a"   # hyperledger/fabric scripts/install-fabric.sh
  SAMPLES_SHA: "5789681b4f4d24e58fa40f19a69f5496892374b6"          # hyperledger/fabric-samples
  MINIO_IMAGE: "quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner hardware
        run: |
          mkdir -p out
          { echo "cpus=$(nproc)"; lscpu | grep -E 'Model name|^CPU\(s\)'; free -m; df -h /; docker version --format 'docker={{.Server.Version}}'; go version || true; } | tee out/runner.txt

      - name: Install Fabric (official script, pinned)
        run: |
          git clone -q https://github.com/hyperledger/fabric-samples.git
          cd fabric-samples && git checkout -q "$SAMPLES_SHA"
          curl -sSLo install-fabric.sh "https://raw.githubusercontent.com/hyperledger/fabric/${INSTALL_SCRIPT_SHA}/scripts/install-fabric.sh"
          chmod +x install-fabric.sh
          ./install-fabric.sh -f "$FABRIC_VERSION" -c "$FABRIC_CA_VERSION" docker binary
          ./bin/peer version | tee -a ../out/runner.txt
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep hyperledger | tee -a ../out/runner.txt

      - name: Start test network (2 orgs, Raft, CA) and create channel
        working-directory: fabric-samples/test-network
        run: |
          start=$(date +%s)
          ./network.sh up createChannel -ca -c mychannel
          echo "network_up_seconds=$(( $(date +%s) - start ))" | tee -a ../../out/runner.txt

      - name: Deploy Go chaincode and invoke
        working-directory: fabric-samples/test-network
        run: |
          start=$(date +%s)
          ./network.sh deployCC -ccn basic -ccp ../asset-transfer-basic/chaincode-go -ccl go
          echo "deploy_seconds=$(( $(date +%s) - start ))" | tee -a ../../out/runner.txt
          export PATH=${PWD}/../bin:$PATH FABRIC_CFG_PATH=${PWD}/../config/
          export CORE_PEER_TLS_ENABLED=true CORE_PEER_LOCALMSPID=Org1MSP
          export CORE_PEER_TLS_ROOTCERT_FILE=${PWD}/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
          export CORE_PEER_MSPCONFIGPATH=${PWD}/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp
          export CORE_PEER_ADDRESS=localhost:7051
          ORD="--tls --cafile ${PWD}/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com"
          P2="--peerAddresses localhost:9051 --tlsRootCertFiles ${PWD}/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt"
          P1="--peerAddresses localhost:7051 --tlsRootCertFiles $CORE_PEER_TLS_ROOTCERT_FILE"
          peer chaincode invoke $ORD -C mychannel -n basic $P1 $P2 -c '{"function":"InitLedger","Args":[]}' --waitForEvent
          peer chaincode query -C mychannel -n basic -c '{"Args":["GetAllAssets"]}' | tee ../../out/query.json
          test -s ../../out/query.json && echo "INVOKE_AND_QUERY_OK" | tee -a ../../out/runner.txt

      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=smoke -e MINIO_ROOT_PASSWORD=smokesmoke "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          curl -sf http://localhost:9000/minio/health/live && echo "MINIO_OK" | tee -a out/runner.txt

      - name: Resource use with everything running
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' | tee out/docker_stats.txt
          free -m | tee -a out/docker_stats.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: out/
